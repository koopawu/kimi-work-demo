[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "kimi-work-demo"
version = "0.1.0"
description = "A minimal, well-structured Python CLI example."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
  {name = "koopawu"},
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
]

[project.scripts]
kimi-demo = "kimi_work_demo.cli:main"

[project.urls]
Repository = "https://github.com/koopawu/kimi-work-demo"
Issues = "https://github.com/koopawu/kimi-work-demo/issues"

[tool.setuptools.packages.find]
where = ["src"]
